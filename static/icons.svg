<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sprite de ícones do Painel Docker.

  Traço monocromático em currentColor, para herdar a cor do contexto (menu
  ativo, botão de perigo, etc.). Substitui os emojis do design herdado, que
  renderizavam coloridos e, em alguns casos, como quadrado vazio quando a
  fonte do Windows não tinha o glifo.

  Uso: <svg class="ico"><use href="/static/icons.svg#nome"/></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="_base" fill="none" stroke="currentColor" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!--
    Marca do painel: um cubo isométrico, lido de imediato como "container".

    Desenho próprio, de propósito — nada de baleia nem de qualquer elemento
    visual da Docker, Inc. (ver NOTICE.md). Três faces chapadas em branco com
    opacidades diferentes sobre o fundo da cor de destaque: funciona melhor
    que traço em tamanhos pequenos, onde linha fina some.
  -->
  <symbol id="logo" viewBox="0 0 24 24">
    <path d="M12 2.6 20.2 7 12 11.4 3.8 7Z"                fill="currentColor" opacity="1"/>
    <path d="M3.3 7.9 11.5 12.3v8.8L3.3 16.7Z"             fill="currentColor" opacity=".62"/>
    <path d="M20.7 7.9 12.5 12.3v8.8l8.2-4.4Z"             fill="currentColor" opacity=".82"/>
  </symbol>

  <symbol id="dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="9" rx="1.5"/>
    <rect x="14" y="3" width="7" height="5" rx="1.5"/>
    <rect x="14" y="12" width="7" height="9" rx="1.5"/>
    <rect x="3" y="16" width="7" height="5" rx="1.5"/>
  </symbol>

  <symbol id="container" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 8.5v7a1.5 1.5 0 0 1-.78 1.32l-7.5 4a1.5 1.5 0 0 1-1.44 0l-7.5-4A1.5 1.5 0 0 1 3 15.5v-7"/>
    <path d="m3.3 7.6 8 4.27a1.5 1.5 0 0 0 1.4 0l8-4.27"/>
    <path d="M11.28 2.68a1.5 1.5 0 0 1 1.44 0l7.5 3.9a.5.5 0 0 1 0 .89"/>
    <path d="M3.78 7.47a.5.5 0 0 1 0-.89l7.5-3.9"/>
    <path d="M12 12.1V21"/>
  </symbol>

  <symbol id="stack" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m12 2 9 5-9 5-9-5 9-5Z"/>
    <path d="m3 12 9 5 9-5"/>
    <path d="m3 17 9 5 9-5"/>
  </symbol>

  <symbol id="image" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>

  <symbol id="volume" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5.5" rx="8" ry="3.5"/>
    <path d="M4 5.5v13c0 1.93 3.58 3.5 8 3.5s8-1.57 8-3.5v-13"/>
    <path d="M4 12c0 1.93 3.58 3.5 8 3.5s8-1.57 8-3.5"/>
  </symbol>

  <symbol id="historico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 2.4-6.1"/>
    <path d="M3 4v5h5"/>
    <path d="M12 7.5V12l3 2"/>
  </symbol>

  <symbol id="config" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
  </symbol>

  <!-- Ações -->
  <symbol id="play" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4.5v15l12-7.5-12-7.5Z"/>
  </symbol>

  <symbol id="stop" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="2"/>
  </symbol>

  <symbol id="restart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
    <path d="M21 3v5h-5"/>
  </symbol>

  <symbol id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"/>
    <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    <path d="M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12"/>
    <path d="M10 11v6M14 11v6"/>
  </symbol>

  <!-- Recolher / expandir o menu. O CSS gira 180° quando retraído. -->
  <symbol id="colapsar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <path d="M10 4v16"/>
    <path d="m16.5 9.5-2.5 2.5 2.5 2.5"/>
  </symbol>

  <!-- Abrir em nova aba (porta publicada) -->
  <symbol id="externo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h6v6"/>
    <path d="M20 4 11 13"/>
    <path d="M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>
  </symbol>

  <!-- Copiar para a área de transferência -->
  <symbol id="copiar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11" height="11" rx="2"/>
    <path d="M5 15V5a2 2 0 0 1 2-2h8"/>
  </symbol>

  <symbol id="logs" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/>
    <path d="M8 9h8M8 13h8M8 17h5"/>
  </symbol>

  <symbol id="mais" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <!-- Tema -->
  <symbol id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
  </symbol>

  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </symbol>
</svg>
