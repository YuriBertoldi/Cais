# Pipeline de validacao do Cais.
#
# Roda em windows-latest de proposito: o painel e um executavel Windows que
# fala com o WSL (wsl.exe), abre o navegador por rundll32 e grava em
# %LOCALAPPDATA%. Parte dos testes -- a traducao de caminho Windows para o
# ponto de montagem do WSL, por exemplo -- so faz sentido nesse alvo.
#
# O job de vulnerabilidades roda em Linux porque e so analise do grafo de
# dependencias, mais barata ali.
#
# Todos os jobs usam "go-version: stable", e nao "go-version-file: go.mod".
# A diretiva `go` do go.mod declara a versao MINIMA da linguagem, nao a do
# toolchain a usar: o setup-go instalaria exatamente aquela versao e o CI
# passaria a compilar e escanear com uma biblioteca padrao sem os patches de
# seguranca publicados depois dela. Com `go 1.26.0` no go.mod, o govulncheck
# acusou 30 vulnerabilidades chamadas na stdlib -- nenhuma delas em
# dependencia nossa, todas ja corrigidas em releases de patch do proprio Go.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo na mesma ref cancela a execucao anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes e analise estatica
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Sem isto, descobrir qual toolchain o job usou exige deducao a partir
      # das versoes citadas no relatorio de vulnerabilidade.
      - run: go version

      - name: Conferir formatacao
        run: |
          $foraDoPadrao = gofmt -l .
          if ($foraDoPadrao) {
            foreach ($arquivo in $foraDoPadrao) {
              Write-Host "::error file=$arquivo::fora do padrao gofmt; rode gofmt -w $arquivo"
            }
            exit 1
          }
          Write-Host "Todos os arquivos estao no padrao gofmt."

      - name: Conferir go.mod e go.sum
        run: |
          go mod tidy
          $pendentes = git status --porcelain go.mod go.sum
          if ($pendentes) {
            Write-Host "::error::go mod tidy alterou go.mod/go.sum; rode e comite o resultado"
            git --no-pager diff go.mod go.sum
            exit 1
          }

      - name: Analise estatica (go vet)
        run: go vet ./...

      - name: Testes
        # As aspas em "-flag=valor" evitam que o PowerShell quebre o argumento
        # no "=" e entregue dois tokens ao go.
        run: go test ./... -count=1 "-covermode=atomic" "-coverprofile=cobertura.out"

      - name: Resumo de cobertura
        run: go tool cover "-func=cobertura.out"

      - name: Detector de corrida
        # Exige CGO e um compilador C. A imagem do runner traz o mingw, mas se
        # um dia deixar de trazer, o aviso e melhor do que um pipeline vermelho
        # por motivo alheio ao codigo.
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $env:CGO_ENABLED = "1"
            go test ./... -count=1 -race
          } else {
            Write-Host "::warning::gcc ausente no runner; detector de corrida nao foi executado"
          }

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura.out
          if-no-files-found: ignore

  seguranca:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Sem isto, descobrir qual toolchain o job usou exige deducao a partir
      # das versoes citadas no relatorio de vulnerabilidade.
      - run: go version

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Executavel
    needs: validar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Sem isto, descobrir qual toolchain o job usou exige deducao a partir
      # das versoes citadas no relatorio de vulnerabilidade.
      - run: go version

      - name: Compilar
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $versao = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $versao = "0.0.0-$($env:GITHUB_SHA.Substring(0,7))"
          }
          Write-Host "Versao: $versao"
          # Exportada para os passos seguintes reutilizarem a mesma versao.
          "VERSAO=$versao" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          .\scripts\build.ps1 -Versao $versao

      - name: Conferir que o binario sobe e responde
        # Fecha o circuito que nenhum teste unitario alcanca: templates e
        # estaticos embutidos, listener em loopback e o /healthz que identifica
        # a instancia. Porta dinamica para nao colidir com nada no runner.
        #
        # O log e lido do arquivo, nao de stdout: o binario e compilado com
        # -H=windowsgui e, sem console, stdout nao e destino confiavel. O
        # painel grava cais.log ao lado do banco, entao -db define os dois.
        run: |
          $dados = Join-Path $env:RUNNER_TEMP "cais-ci"
          New-Item -ItemType Directory -Force -Path $dados | Out-Null
          $arquivoLog = Join-Path $dados "cais.log"

          $proc = Start-Process -FilePath .\cais.exe `
            -ArgumentList "-porta","0","-no-browser","-db","$dados\painel.db" `
            -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) {
              Write-Host "::error::o painel encerrou sozinho (codigo $($proc.ExitCode))"
              if (Test-Path $arquivoLog) { Get-Content $arquivoLog }
              exit 1
            }
            if (-not (Test-Path $arquivoLog)) {
              Write-Host "::error::o painel nao gravou $arquivoLog"
              exit 1
            }
            # A porta efetiva sai no log de startup.
            $log = (Get-Content $arquivoLog) -join "`n"
            if ($log -notmatch 'http://127\.0\.0\.1:(\d+)/') {
              Write-Host "::error::nao foi possivel descobrir a porta no log de startup"
              Write-Host $log
              exit 1
            }
            $url = "http://127.0.0.1:$($Matches[1])/healthz"
            $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
            if ($resp.StatusCode -ne 200 -or -not $resp.Headers["X-Cais"]) {
              Write-Host "::error::/healthz respondeu $($resp.StatusCode) sem identificacao"
              exit 1
            }
            Write-Host "Painel respondeu em $url (versao $($resp.Headers["X-Cais"]))."
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Conferir que o icone entrou no executavel
        # O recurso vem do .syso versionado. Se o arquivo sumir ou perder o
        # sufixo _windows_amd64, o build continua passando e o .exe sai sem
        # icone -- falha silenciosa que so apareceria no Explorer.
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path .\cais.exe).Path)
          if (-not $ico) {
            Write-Host "::error::o executavel saiu sem icone embutido"
            exit 1
          }
          Write-Host "Icone embutido: $($ico.Width)x$($ico.Height)."

      - name: Conferir que o executavel nao abre console
        # Subsystem 2 = GUI (sem janela de console), 3 = console. Sem o
        # -H=windowsgui do build.ps1, o duplo-clique deixaria uma janela preta
        # aberta durante toda a vida do painel.
        run: |
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path .\cais.exe).Path)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $subsistema = [BitConverter]::ToUInt16($b, $pe + 92)
          if ($subsistema -ne 2) {
            Write-Host "::error::Subsystem do PE = $subsistema; esperado 2 (janela, sem console)"
            exit 1
          }
          Write-Host "Subsystem do PE = 2: sem console."

      - name: Compilar para Linux
        run: .\scripts\build.ps1 -Versao "${{ env.VERSAO }}" -Plataforma linux

      - name: Conferir que o binario Linux e um ELF
        run: |
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path .\cais-linux-amd64).Path)
          $magico = [System.Text.Encoding]::ASCII.GetString($b[1..3])
          if ($b[0] -ne 0x7F -or $magico -ne "ELF") {
            Write-Host "::error::cais-linux-amd64 nao e um ELF"
            exit 1
          }
          Write-Host "cais-linux-amd64 e um ELF valido."

      - name: Publicar executaveis
        uses: actions/upload-artifact@v4
        with:
          name: cais-binarios
          path: |
            cais.exe
            cais-linux-amd64
          retention-days: 14
